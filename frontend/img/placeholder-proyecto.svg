<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-label="Sin imagen de proyecto">
  <!-- Fondo neutro que funciona en modo claro y oscuro -->
  <rect width="640" height="400" fill="#8888" rx="8"/>

  <!-- Ícono de imagen simple -->
  <g transform="translate(320,180)" stroke="#999" stroke-width="3" fill="none">
    <!-- Marco de imagen -->
    <rect x="-60" y="-55" width="120" height="90" rx="6"/>
    <!-- Montaña estilizada -->
    <polyline points="-45,28 -10,-15 15,10 35,-20 58,28"/>
    <!-- Sol -->
    <circle cx="35" cy="-28" r="12"/>
  </g>

  <!-- Texto -->
  <text
    x="320" y="260"
    font-family="system-ui, sans-serif"
    font-size="18"
    fill="#999"
    text-anchor="middle"
  >Sin imagen disponible</text>
</svg>
